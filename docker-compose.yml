services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cyberforce_monitoring}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberforce_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cyberforce-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberforce-backend
    restart: unless-stopped
    command: sh -c "node dist/db/migrate.js && node dist/db/seed.js && node dist/api/server.js"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-cyberforce_monitoring}
    env_file:
      - path: .env
        required: false
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cyberforce-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberforce-worker
    restart: unless-stopped
    command: node dist/worker/worker.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-cyberforce_monitoring}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - cyberforce-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberforce-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cyberforce-network

networks:
  cyberforce-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
